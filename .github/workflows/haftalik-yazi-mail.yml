name: Haftalık yazı e-postası
on:
  schedule:
    # GitHub bazen zamanlanmış çalıştırmayı atlıyor; yedek saatler eklendi.
    # Aynı konu zaten gönderildiyse betik tekrar göndermez.
    - cron: "7 5 * * 1"    # Pzt 08:07 TRT
    - cron: "23 8 * * 1"   # Pzt 11:23 TRT (yedek)
    - cron: "41 12 * * 1"  # Pzt 15:41 TRT (yedek)
    - cron: "17 6 * * 2"   # Sal 09:17 TRT (yedek)
    - cron: "33 7 * * 3"   # Çar 10:33 TRT (yedek)
  workflow_dispatch:
    inputs:
      column_no:
        description: "Sayı (boş = bugünün yazısı)"
        required: false
      draft:
        description: "1 = sadece taslak oluştur"
        required: false
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/send-column.mjs
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          COLUMN_NO: ${{ inputs.column_no }}
          DRAFT: ${{ inputs.draft }}
